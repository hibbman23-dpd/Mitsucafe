          - paragraph [ref=f2e44]: Sương nằm trên dốc Khe Sanh, quay mặt về một thung lũng thông. Từ 7 đến 9 giờ sáng, sương từ đèo tràn qua vách kính — quán chìm hẳn vào trong mây, và đó là lý do quán tồn tại.
