name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - web/**
      - src/**
      - wrangler.jsonc
      - wrangler.ops.jsonc
      - .github/workflows/cloudflare.yml
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy public worker (kaerukaphe)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.98.0"
          command: deploy
      - name: Deploy internal worker (kaeru-ops)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.98.0"
          command: deploy -c wrangler.ops.jsonc
